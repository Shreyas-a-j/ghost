[package]
name = "ghost-workflow"
version = "0.1.0"
edition = "2021"
description = "Generate a lean, project-level OpenCode workflow"
license = "MIT"
readme = "README.md"
keywords = ["opencode", "workflow", "cli", "specs", "productivity"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "ghost"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
console = "0.16.6"
dialoguer = "0.12.0"
minijinja = { version = "3.1.0", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"
